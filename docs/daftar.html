<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daftar — Halora</title>
<meta name="description" content="Buat akun demo Halora. Hanya nama dan email yang disimpan, di perangkatmu sendiri.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<header class="site-header" data-site-header></header>
<main>
  <section class="section">
    <div class="container" style="display:flex;justify-content:center">
      <form class="form-card" id="registerForm" novalidate style="width:100%">
        <span class="eyebrow">Akun Demo</span>
        <h1 style="font-size:30px;margin-bottom:8px">Buat akun</h1>
        <p style="color:var(--forest-2);margin-bottom:22px">Akun demo hanya menyimpan nama dan email di perangkat ini — kata sandimu tidak pernah disimpan.</p>
        <div class="field">
          <label for="rNama">Nama lengkap</label>
          <input id="rNama" name="nama" type="text" placeholder="Nama kamu" required>
        </div>
        <div class="field">
          <label for="rEmail">Email</label>
          <input id="rEmail" name="email" type="email" placeholder="nama@email.com" required>
        </div>
        <div class="field">
          <label for="rPass">Kata sandi</label>
          <input id="rPass" name="password" type="password" placeholder="Minimal 6 karakter" required>
        </div>
        <button class="btn btn-dark btn-block" type="submit">Daftar</button>
        <p class="form-msg" role="status"></p>
        <p style="font-size:14px;color:var(--forest-2);margin-top:10px">Sudah punya akun? <a href="masuk.html">Masuk</a></p>
      </form>
    </div>
  </section>
</main>
<footer class="site-footer" data-site-footer></footer>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/components.js"></script>
<script src="js/app.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
